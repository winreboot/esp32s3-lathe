[env:esp32s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
; Anti-aliased fonts for the display, linked into the firmware: digits (d_*.vlw, tools/make_vlw.py) and text (t_*.vlw, d_rpm.vlw, tools/make_vlw_text.py); and the screen artwork (art/*.png, tools/make_art.py)
board_build.embed_files =
    fonts/d_big.vlw
    fonts/d_mid.vlw
    fonts/d_small.vlw
    fonts/t_big.vlw
    fonts/t_small.vlw
    fonts/d_rpm.vlw
    fonts/t_mid.vlw
    fonts/t_xl.vlw
    art/plain.png
    art/rpm.png
    art/menu.png
    art/keypad.png
    art/info.png
    art/view.png
    art/main.png
    art/xz.png
    art/plain_k.png
    art/rpm_k.png
    art/menu_k.png
    art/keypad_k.png
    art/info_k.png
    art/view_k.png
    art/main_k.png
    art/xz_k.png
    art/thread.png
    art/diag.png
    art/mat.png
    art/numpad.png
    art/tools.png
    art/pick.png
    art/thread_k.png
    art/diag_k.png
    art/mat_k.png
    art/numpad_k.png
    art/tools_k.png
    art/pick_k.png
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DFW_VERSION=\"1.14.0\"
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.2.0
    bblanchon/ArduinoJson @ ^7.1.0
    lovyan03/LovyanGFX @ 1.1.16
